<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/color-variables.css">
        <link rel="stylesheet" href="../css/main-styles.css">
        <link rel="stylesheet" href="../css/lists-nav-bar.css">
        <link rel="stylesheet" href="../css/add-task-component.css">
        <link rel="stylesheet" href="../css/task-list-component.css">
        <link rel="stylesheet" href="../css/add-list-pop-up.css">
        <title>To-Do app</title>
    </head>
    <body>
        <div id="lists-nav-bar">
            <h2>Lists</h2>
            <label for="lists">Choose a list:</label>
            <select id="lists" name="lists">
                <option value="list1">Default List</option>
            </select>
            <button id="add-list-button" type="button">Add List</button>
        </div>

        <div id="add-list-pop-up" class="hidden">
            <h2>Add List</h2>
            <label for="add-list-name">List Name
            <input id="add-list-name" maxlength="25" type="text" placeholder="e.g. Work"></label>
            <button id="add-list-confirm-button" type="button">Add List</button>
            <button id="add-list-cancel-button" type="button">Exit</button>
        </div>

        <div id="main-container">
            <h1 id="app-title">To-Do App</h1>
            <form id="add-task-component">
                <label for="add-task-description">Add Task Description
                <input id="add-task-description" maxlength="25" type="text" placeholder="e.g. Cleaning my room"></label>
                <button id="add-task-button" type="submit">Add Task</button>
            </form>

            <div id="task-list-component">
                <h3 id="current-list">list</h3>
                <div class="task">
                    <input class="task-checkbox" type="checkbox"></input>
                    <p class="task-description">Clean House</p>
                    <button class="remove-task-button" type="button">Remove Task</button>
                </div>
            </div>
        </div>
        
        <script src="../js/handle-task.js"></script>
        <script src="../js/new-list.js"></script>
    </body>
</html>
